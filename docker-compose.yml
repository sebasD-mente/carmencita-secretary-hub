services:
  carmencita-db:
    image: pgvector/pgvector:pg16-alpine
    container_name: carmencita_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carmencita_db
      POSTGRES_USER: carmencita_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carmencita_secure_pass_2026}
    volumes:
      - carmencita_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carmencita_user -d carmencita_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - carmencita_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  carmencita-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carmencita_hub
    restart: unless-stopped
    depends_on:
      carmencita-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3050
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://carmencita_user:${DB_PASSWORD:-carmencita_secure_pass_2026}@carmencita-db:5432/carmencita_db?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-${GEMINI_API_KEY}}
      CARMENCITA_API_KEY: ${CARMENCITA_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
    volumes:
      - carmencita_vault:/app/data
    ports:
      - "3050:3050"
    networks:
      - carmencita_net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  carmencita_net:
    name: carmencita_net
    driver: bridge

volumes:
  carmencita_db_data:
    name: carmencita_db_data
  carmencita_vault:
    name: carmencita_vault
